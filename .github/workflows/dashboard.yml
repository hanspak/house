# 구글 드라이브의 최신 KB 주간·월간 시계열로 대시보드를 만들어 GitHub Pages에 올린다.
#   index.html   = 주간 아파트 국면판,  monthly.html = 월간 주택 시장판(오피스텔 포함)
# 자료가 오래되면(주간 14일, 월간 2개월 초과) 배포는 하되 마지막 'freshness' 작업을 실패시켜 메일 알림을 받는다.
#   trades.html  = 실거래·거래량·금리 (국토부 실거래가, 부동산원 R-ONE, 한국은행 ECOS)
# 필요한 저장소 Secrets: KB_SA_KEY_JSON (서비스 계정 키 JSON 전체), KB_DRIVE_FOLDER_ID,
#                        DATA_GO_KR_KEY, RONE_KEY, ECOS_KEY (없으면 trades.html은 안내 페이지)
name: 국면판 갱신

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 KST (UTC 00:00)
  workflow_dispatch:       # Actions 탭의 "Run workflow" 버튼으로 즉시 실행
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.fresh.outputs.stale }}
      message: ${{ steps.fresh.outputs.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 전국 실거래 집계 검사
        run: python -m unittest discover -s tests -v

      - name: 서비스 계정 키 준비
        env:
          KB_SA_KEY_JSON: ${{ secrets.KB_SA_KEY_JSON }}
        run: |
          if [ -z "$KB_SA_KEY_JSON" ]; then echo "::error::저장소 Secret KB_SA_KEY_JSON이 없습니다."; exit 1; fi
          mkdir -p secrets
          printf '%s' "$KB_SA_KEY_JSON" > secrets/kb-drive-sa.json
          chmod 600 secrets/kb-drive-sa.json

      - name: 드라이브에서 받아 주간 국면판 생성
        env:
          KB_DRIVE_FOLDER_ID: ${{ secrets.KB_DRIVE_FOLDER_ID }}
        run: python scripts/kb_dashboard.py --drive

      - name: 드라이브에서 받아 월간 주택 시장판 생성
        env:
          KB_DRIVE_FOLDER_ID: ${{ secrets.KB_DRIVE_FOLDER_ID }}
        run: python scripts/kb_monthly_dashboard.py --drive

      # 실거래 응답 캐시: 지난 달들은 다시 받지 않도록 실행 사이에 보관 (최근 3개월만 매번 새로 받음)
      - name: 실거래 캐시 복원
        uses: actions/cache@v4
        with:
          path: cache/molit
          key: molit-${{ github.run_id }}
          restore-keys: molit-

      - name: 실거래·거래량·금리 생성
        env:
          KB_DRIVE_FOLDER_ID: ${{ secrets.KB_DRIVE_FOLDER_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          RONE_KEY: ${{ secrets.RONE_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python scripts/kb_trades_dashboard.py --drive

      - name: 자료 기준일 점검
        id: fresh
        run: python scripts/kb_status.py check >> "$GITHUB_OUTPUT"

      - name: Pages 파일 준비
        run: |
          mkdir -p _site
          cp dashboard/latest.html _site/index.html
          cp dashboard/monthly.html _site/monthly.html
          cp dashboard/trades.html _site/trades.html
          cp dashboard/kb_dashboard_*.html dashboard/monthly_*.html dashboard/status.json _site/
          touch _site/.nojekyll

      - name: 키 파일 삭제
        if: always()
        run: rm -f secrets/kb-drive-sa.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  freshness:
    needs: [build, deploy]
    if: needs.build.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 자료가 오래됨
        run: |
          echo "::error::${{ needs.build.outputs.message }}"
          exit 1
