# 구글 드라이브의 최신 KB 주간·월간 시계열로 대시보드를 만들어 GitHub Pages에 올린다.
#   index.html   = 주간 아파트 국면판,  monthly.html = 월간 주택 시장판(오피스텔 포함)
# 자료가 오래되면(주간 14일, 월간 2개월 초과) 배포는 하되 마지막 'freshness' 작업을 실패시켜 메일 알림을 받는다.
#   trades.html  = 실거래·거래량·금리 (국토부 실거래가, 부동산원 R-ONE, 한국은행 ECOS)
# 필요한 저장소 Secrets: KB_SA_KEY_JSON (서비스 계정 키 JSON 전체), KB_DRIVE_FOLDER_ID,
#                        DATA_GO_KR_KEY, RONE_KEY, ECOS_KEY (별도 데이터 갱신 작업에서 사용)
# 예약·수동 실행은 게시 → 수집(refresh·housing) → 수집 성공 시 게시 전용 실행(publish_only)을 다시 띄워 바로 반영한다.
name: 국면판 갱신

on:
  schedule:
    # 정각은 GitHub 대기열이 몰려 몇 시간씩 늦게 시작하므로, 새벽 비정각에 예약해 오전 9시 전에 끝나게 한다.
    - cron: "17 18 * * *"  # 매일 03:17 KST (UTC 18:17)
  workflow_dispatch:       # Actions 탭의 "Run workflow" 버튼으로 즉시 실행
    inputs:
      publish_only:
        description: "수집 없이 저장된 자료로 화면만 다시 게시"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "docs/**"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# 게시(build·deploy)만 새 실행이 이전 실행을 취소한다. 자료 수집(refresh·housing)은 push로 취소되지 않도록 job별로 따로 묶는다.
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    outputs:
      stale: ${{ steps.fresh.outputs.stale }}
      message: ${{ steps.fresh.outputs.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 대시보드 지표·지역 비교 계산 검사
        run: node --test tests/market_analysis.test.cjs tests/overview_comparison.test.cjs tests/profile_loader.test.cjs tests/trade_composition.test.cjs tests/run_status.test.cjs

      - name: 전국 실거래 집계 검사
        run: python -m unittest discover -s tests -v

      - name: 서비스 계정 키 준비
        env:
          KB_SA_KEY_JSON: ${{ secrets.KB_SA_KEY_JSON }}
        run: |
          if [ -z "$KB_SA_KEY_JSON" ]; then echo "::error::저장소 Secret KB_SA_KEY_JSON이 없습니다."; exit 1; fi
          mkdir -p secrets
          printf '%s' "$KB_SA_KEY_JSON" > secrets/kb-drive-sa.json
          chmod 600 secrets/kb-drive-sa.json

      - name: 드라이브에서 받아 주간 국면판 생성
        env:
          KB_DRIVE_FOLDER_ID: ${{ secrets.KB_DRIVE_FOLDER_ID }}
        run: python scripts/kb_dashboard.py --drive

      - name: 드라이브에서 받아 월간 주택 시장판 생성
        env:
          KB_DRIVE_FOLDER_ID: ${{ secrets.KB_DRIVE_FOLDER_ID }}
        run: python scripts/kb_monthly_dashboard.py --drive

      - name: 마지막 게시용 실거래 자료 복원
        uses: actions/cache/restore@v4
        with:
          path: cache/published
          key: trades-published-${{ github.run_id }}
          restore-keys: trades-published-

      - name: 전국 실거래 화면 생성
        run: python scripts/kb_trades_dashboard.py --snapshot

      - name: 마지막 공급·전월세 집계 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/published/housing
            cache/published/collection-status/supply.json
            cache/published/collection-status/rents.json
            cache/published/collection-status/pipeline.json
            cache/published/collection-status/moveins.json
          key: housing-published-${{ github.run_id }}
          restore-keys: housing-published-

      - name: 관심 지역 종합 화면 생성
        run: python scripts/market_overview.py

      - name: 자료 기준일 점검
        id: fresh
        run: python scripts/kb_status.py check >> "$GITHUB_OUTPUT"

      - name: Pages 파일 준비
        run: |
          mkdir -p _site
          cp dashboard/latest.html _site/index.html
          cp dashboard/monthly.html _site/monthly.html
          cp dashboard/trades.html _site/trades.html
          cp dashboard/overview.html _site/overview.html
          cp -R dashboard/trades-data _site/trades-data
          cp -R dashboard/overview-data _site/overview-data
          cp dashboard/kb_dashboard_*.html dashboard/monthly_*.html dashboard/status.json _site/
          touch _site/.nojekyll

      - name: 키 파일 삭제
        if: always()
        run: rm -f secrets/kb-drive-sa.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  freshness:
    needs: [build, deploy]
    if: needs.build.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 자료가 오래됨
        run: |
          echo "::error::${{ needs.build.outputs.message }}"
          exit 1

  refresh:
    # 수집 실패·시간 초과가 화면 게시를 막지 않도록 배포 완료 후 갱신한다.
    # 게시가 취소·실패해도 수집은 진행한다(always).
    needs: deploy
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_only))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: |
            cache/molit
            storage/trades
            storage/extra
            cache/published
          key: molit-${{ github.run_id }}
          restore-keys: molit-

      - name: 전국 실거래 갱신 (최대 35분)
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MOLIT_API_ATTEMPTS: "2"
        run: python -u scripts/collection_runs.py --name trades --timeout 2100 --result cache/trades.json -- python -u scripts/molit_trades.py --workers 12

      - name: R-ONE trade volume
        continue-on-error: true
        env:
          RONE_KEY: ${{ secrets.RONE_KEY }}
        run: python -u scripts/collection_runs.py --name apt_trades --timeout 300 -- python -u scripts/market_extra.py --source apt_trades

      - name: R-ONE unsold homes
        continue-on-error: true
        env:
          RONE_KEY: ${{ secrets.RONE_KEY }}
        run: python -u scripts/collection_runs.py --name unsold --timeout 300 -- python -u scripts/market_extra.py --source unsold

      - name: ECOS rates
        id: rates
        continue-on-error: true
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python -u scripts/collection_runs.py --name rates --timeout 300 -- python -u scripts/market_extra.py --source rates

      # ECOS는 몇 분씩 연결이 안 될 때가 있어, 실패하면 2분 뒤 한 번 더 받는다.
      - name: ECOS rates retry
        if: steps.rates.outcome == 'failure'
        continue-on-error: true
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          sleep 120
          python -u scripts/collection_runs.py --name rates --timeout 300 -- python -u scripts/market_extra.py --source rates

      - name: 완전한 전국 자료를 게시용 집계로 저장
        if: steps.collect.outcome == 'success'
        env:
          KB_SA_KEY_JSON: ${{ secrets.KB_SA_KEY_JSON }}
          KB_DRIVE_FOLDER_ID: ${{ secrets.KB_DRIVE_FOLDER_ID }}
        run: |
          mkdir -p secrets
          printf '%s' "$KB_SA_KEY_JSON" > secrets/kb-drive-sa.json
          chmod 600 secrets/kb-drive-sa.json
          python scripts/kb_trades_dashboard.py --no-fetch --drive

      - name: 키 파일 삭제
        if: always()
        run: rm -f secrets/kb-drive-sa.json

      - name: 수집한 월별 캐시 보존
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/molit
            storage/trades
            storage/extra
            cache/published
          key: molit-${{ github.run_id }}

      - name: 다음 배포용 집계 자료 보존
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/published
          key: trades-published-${{ github.run_id }}


  housing:
    # 공급·임대차 수집은 기존 실거래 수집과 독립 실행하여 게시를 지연시키지 않는다.
    needs: deploy
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.publish_only))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: housing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            cache/molit-rents
            storage/rents
            storage/supply
            storage/pipeline
            storage/moveins
            cache/supply
            cache/published/collection-status/supply.json
            cache/published/collection-status/rents.json
            cache/published/collection-status/pipeline.json
            cache/published/collection-status/moveins.json
            cache/published/housing
          key: housing-${{ github.run_id }}
          restore-keys: housing-
      - name: 공식 미분양 갱신 (최대 5분)
        continue-on-error: true
        run: python -u scripts/collection_runs.py --name supply --timeout 300 -- python -u scripts/housing_supply.py
      - name: 아파트 공급 단계 갱신 (최대 5분)
        continue-on-error: true
        run: python -u scripts/collection_runs.py --name pipeline --timeout 300 -- python -u scripts/housing_pipeline.py
      - name: 공동주택 입주예정 갱신 (최대 2분)
        continue-on-error: true
        run: python -u scripts/collection_runs.py --name moveins --timeout 120 -- python -u scripts/housing_moveins.py
      - name: 전국 전월세 갱신 (최대 20분)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -u scripts/collection_runs.py --name rents --timeout 1200 --result cache/rents.json -- python -u scripts/molit_rents.py --months 6 --workers 8
      - name: 받은 공급·임대차 캐시 보존
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/molit-rents
            storage/rents
            storage/supply
            storage/pipeline
            storage/moveins
            cache/supply
            cache/published/collection-status/supply.json
            cache/published/collection-status/rents.json
            cache/published/collection-status/pipeline.json
            cache/published/collection-status/moveins.json
            cache/published/housing
          key: housing-${{ github.run_id }}
      - name: 다음 배포용 공급·임대차 집계 보존
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/published/housing
            cache/published/collection-status/supply.json
            cache/published/collection-status/rents.json
            cache/published/collection-status/pipeline.json
            cache/published/collection-status/moveins.json
          key: housing-published-${{ github.run_id }}

  republish:
    # 수집한 자료가 다음 실행까지 기다리지 않고 바로 화면에 반영되도록, 수집 없이 게시만 하는 실행을 띄운다.
    needs: [refresh, housing]
    if: always() && (needs.refresh.result == 'success' || needs.housing.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 게시 전용 실행 시작
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f publish_only=true
